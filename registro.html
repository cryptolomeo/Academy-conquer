<main>
  <section class="register">
    <div class="container">
      <div class="register__container">
        <h1 class="register__title">
          Formulario de inscripción
        </h1>

        <p class="register__description">
          Rellena cuidadosamente el formulario de inscripción para
          poder acceder a nuestra academia.
        </p>

        <form class="register__form" method="post" enctype="multipart/form-data">

          <fieldset class="register__fieldset">
            <legend class="register__legend">Datos personales</legend>

            <div class="register__field">
              <label class="register__label" for="name">Nombre</label>
              <input class="register__control" type="text" name="name" id="name" required>
            </div>

            <div class="register__field">
              <label class="register__label" for="last-name">Primer apellido</label>
              <input class="register__control" type="text" name="last-name" id="last-name" required>
            </div>

            <div class="register__field">
              <label class="register__label" for="second-last-name">Segundo apellido</label>
              <input class="register__control"
                type="text"
                name="second-last-name"
                id="second-last-name"
              >
            </div>

            <div class="register__field">
              <label class="register__label" for="birth">Fecha de nacimiento</label>
              <input class="register__control" type="date" name="birth" id="birth" required>
            </div>

            <div class="register__field">
              <label class="register__label" for="gender">Género</label>
              <select class="register__control" name="gender" id="gender">
                <option value="">Selecciona una opción</option>
                <option value="masculino">Masculino</option>
                <option value="femenino">Femenino</option>
              </select>
            </div>

            <div class="register__field">
              <label class="register__label" for="photo">Fotografía</label>
              <input class="register__control register__control--photo" type="file" name="photo" id="photo">
            </div>

            <div class="register__field">
              <label class="register__label" for="bio">Biografía</label>
              <textarea
                class="register__control"
                name="bio"
                id="bio"
                rows="5"
              ></textarea>
            </div>
          </fieldset>


          <fieldset class="register__fieldset">
            <legend class="register__legend">Datos de contacto</legend>

            <div class="register__field">
              <label class="register__label" for="email">Correo electrónico</label>
              <input
                class="register__control"
                type="email"
                name="email"
                id="email"
                placeholder="ejemplo@ejemplo.com"
                required
              >
            </div>

            <div class="register__field">
              <label class="register__label" for="telephone">Número de teléfono</label>
              <input
                class="register__control"
                type="tel"
                name="telephone"
                id="telephone"
                placeholder="600 000 000"
              >
            </div>
          </fieldset>


          <fieldset class="register__fieldset">
            <legend class="register__legend">Dirección</legend>

            <div class="register__field">
              <label class="register__label" for="address">Dirección</label>
              <input class="register__control" type="text" name="address" id="address">
            </div>

            <div class="register__field">
              <label class="register__label" for="city">Ciudad</label>
              <input class="register__control" type="text" name="city" id="city">
            </div>

            <div class="register__field">
              <label class="register__label" for="state">Provincia</label>
              <input class="register__control" type="text" name="state" id="state">
            </div>

            <div class="register__field">
              <label class="register__label" for="post-code">Código postal</label>
              <input class="register__control" type="text" name="post-code" id="post-code">
            </div>
          </fieldset>


          <div class="register__actions">
            <button class="button" type="submit">
              Enviar
            </button>

          </div>
        </form>
      </div>
    </div>
  </section>
